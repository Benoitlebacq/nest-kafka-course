# Docker Compose : l’infrastructure de développement d’EventFlow (Kafka, Kafka UI, Postgres)

services:
  # Kafka Message Broker, in KRaft mode: since Kafka 4.0 there is no ZooKeeper anymore,
  # the same node is both broker and controller.
  kafka:
    image: apache/kafka:4.4.0
    container_name: api-gateway-kafka
    ports:
      - "9093:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

  # Kafka UI (optional - for debugging): kafbat/kafka-ui, the maintained fork of provectuslabs/kafka-ui
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: api-gateway-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: api-gateway
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: api-gateway-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: api-gateway
      POSTGRES_PASSWORD: my_password
      POSTGRES_DB: api-gateway
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api-gateway"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
